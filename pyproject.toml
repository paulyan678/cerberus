[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus-cctv"
version = "0.1.0"
description = "CCTV video understanding, event classification, and retrieval toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Juho Kim"},
  {name = "Minchan Kim"},
  {name = "Jacky Kuang"},
  {name = "Paul Yan"},
]
dependencies = [
  "google-genai>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3.2,<6"]
docs = ["sphinx>=8,<10"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "sentence-transformers>=3.2,<6",
  "sphinx>=8,<10",
]

[project.scripts]
cerberus-upload = "cerberus.cli:upload_main"
cerberus-describe = "cerberus.cli:describe_main"
cerberus-embed = "cerberus.cli:embed_main"
cerberus-search-dense = "cerberus.cli:dense_main"
cerberus-search-sparse = "cerberus.cli:sparse_main"
cerberus-evaluate-ir = "cerberus.cli:ir_eval_main"
cerberus-confusion = "cerberus.cli:confusion_main"
cerberus-list = "cerberus.cli:list_files_main"
cerberus-delete = "cerberus.cli:delete_files_main"
cerberus-demo = "cerberus.cli:demo_main"

[tool.setuptools.packages.find]
include = ["cerberus*"]

[tool.setuptools.package-data]
cerberus = ["demo_data/*.json", "demo_data/*.jsonl"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=cerberus --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
